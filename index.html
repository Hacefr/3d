<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Studio Engine</title>
    <style>
        /* === BASE STYLES === */
        :root { --bg-main: #181818; --bg-panel: #202020; --bg-toolbar: #252526; --bg-hover: #2a2d2e; --border: #333333; --text-main: #cccccc; --text-muted: #888888; --accent: #094771; --accent-hover: #0b5a90; --accent-btn: #006eb4; --danger: #cc3333; --success: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; height: 100vh; font-size: 13px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* === LAYOUT === */
        #toolbar { height: 40px; background: var(--bg-toolbar); display: flex; align-items: center; padding: 0 10px; gap: 6px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        #main-area { display: flex; flex: 1; height: calc(100vh - 190px); }
        #left-panel { width: 270px; background: var(--bg-panel); padding: 15px; border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        #viewport { flex: 1; position: relative; background: #0f0f0f; outline: none; }
        #right-panel { width: 280px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        #asset-browser { height: 150px; background: var(--bg-panel); border-top: 1px solid var(--border); padding: 10px 15px; display: flex; flex-direction: column; }
        
        /* === UI ELEMENTS === */
        button { background: transparent; color: var(--text-main); border: 1px solid transparent; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.1s; white-space: nowrap; }
        button:hover { background: var(--bg-hover); border-color: #444; }
        button.active { background: var(--bg-hover); border-color: #555; }
        .btn-primary { background: var(--accent-btn); color: white; border-color: var(--accent-btn); }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-danger:hover { background: var(--danger); border-color: var(--danger); color: white; }
        .btn-success { background: var(--success); border-color: var(--success); color: white; font-weight: bold; }
        .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
        h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; font-weight: 600; }
        
        /* === PROPERTIES === */
        .prop-box { background: var(--bg-main); border: 1px solid var(--border); border-radius: 4px; padding: 10px; }
        .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .prop-label { color: var(--text-muted); font-size: 11px; flex: 1; }
        select, input[type="text"], .transform-group input { background: #222; border: 1px solid #444; color: white; font-size: 11px; padding: 3px 6px; border-radius: 2px; outline: none; }
        input[type="text"]:focus, .transform-group input:focus { border-color: var(--accent-btn); }
        
        /* FIX: COLOR CODED XYZ INPUTS */
        .transform-group { display: flex; gap: 4px; flex: 2; }
        .transform-group input { width: 100%; text-align: center; border-bottom-width: 2px; }
        .transform-group input:nth-child(1) { border-bottom-color: #ff4444; } /* Red X */
        .transform-group input:nth-child(2) { border-bottom-color: #44ff44; } /* Green Y */
        .transform-group input:nth-child(3) { border-bottom-color: #4488ff; } /* Blue Z */
        
        input[type="range"] { width: 120px; accent-color: var(--accent-btn); }
        input[type="color"] { width: 30px; height: 20px; border: 1px solid #444; background: none; cursor: pointer; padding: 0; border-radius: 2px; }
        input[type="checkbox"] { cursor: pointer; accent-color: var(--accent-btn); width: 16px; height: 16px; }

        /* === FPS COUNTER === */
        #fps-counter { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 4px 8px; border-radius: 4px; color: #44ff44; font-weight: bold; font-size: 12px; pointer-events: none; display: none; z-index: 10; border: 1px solid #333; }

        /* === EXPLORER & ASSETS === */
        #explorer-header { padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--bg-toolbar); font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; display: flex; justify-content: space-between; }
        #explorer-tree { flex: 1; overflow-y: auto; padding: 4px 0; user-select: none; }
        .tree-item { padding: 4px 10px; display: flex; align-items: center; cursor: pointer; color: var(--text-main); white-space: nowrap; transition: 0.1s; border: 1px solid transparent; }
        .tree-item:hover { background-color: var(--bg-hover); }
        .tree-item.selected { background-color: var(--accent); color: white; }
        .tree-item.drag-over { border-top: 2px solid var(--accent-btn); background-color: #222; }
        .tree-icon { display: flex; align-items: center; margin-right: 6px; opacity: 0.8; pointer-events: none; }
        .tree-icon svg { width: 14px; height: 14px; }
        .indent { width: 14px; display: inline-block; pointer-events: none; }

        #file-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #asset-grid { display: flex; gap: 8px; overflow-x: auto; flex: 1; align-items: center; padding-bottom: 4px; }
        .asset-card { width: 64px; height: 64px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: grab; text-align: center; font-size: 10px; overflow: hidden; padding: 4px; color: var(--text-muted); position: relative; }
        .asset-card:active { cursor: grabbing; }
        .asset-card:hover { border-color: var(--text-muted); background: var(--bg-hover); color: var(--text-main); }
        .asset-card img { max-width: 100%; max-height: 36px; object-fit: contain; margin-bottom: 4px; image-rendering: pixelated; pointer-events: none; }
        .asset-card svg { margin-bottom: 4px; width: 20px; height: 20px; pointer-events: none; }
        .zip-badge { position: absolute; top: 2px; right: 2px; background: var(--accent); color: white; font-size: 8px; padding: 1px 3px; border-radius: 2px; pointer-events: none; }
        .hidden-input { display: none; }

        #modal-backdrop { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        #zip-modal { background: var(--bg-panel); width: 650px; max-height: 80vh; border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #zip-header { padding: 12px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-toolbar); border-radius: 6px 6px 0 0; font-weight: bold; }
        #zip-content { padding: 10px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .zip-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 4px; }
        .zip-item:hover { border-color: #555; }
        .zip-item-name { display: flex; align-items: center; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .zip-folder-path { color: #777; font-size: 10px; margin: 0 6px; }
    </style>

    <!-- Three.js & Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.0/umd/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div id="modal-backdrop">
        <div id="zip-modal">
            <div id="zip-header">
                <span>📦 Zip Archive Explorer</span>
                <button id="close-zip-modal" style="padding: 2px 6px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <div id="zip-content"></div>
        </div>
    </div>

    <!-- TOP TOOLBAR -->
    <div id="toolbar">
        <button id="btn-save" class="btn-success"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save Project</button>
        <button id="btn-load"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Load</button>
        <input type="file" id="load-project-input" class="hidden-input" accept=".studio">
        <div class="divider"></div>

        <button id="add-part"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg> Part</button>
        <button id="spawn-r6"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> R6 Rig</button>
        <button id="spawn-mc"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> MC Rig</button>
        <input type="file" id="mc-skin-input" class="hidden-input" accept="image/png, image/jpeg">
        <button id="add-light"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/></svg> Light</button>
        
        <div class="divider"></div>
        <button id="tool-space"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> World Space</button>
        <div class="divider"></div>
        
        <button id="tool-translate" class="active"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg> Move (1)</button>
        <button id="tool-rotate"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> Rotate (2)</button>
        <button id="tool-scale"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg> Scale (3)</button>
        
        <div class="divider"></div>
        <button id="tool-duplicate"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Dup</button>
        <button id="tool-delete" class="btn-danger"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Del</button>
        
        <button class="btn-primary" id="render-btn" style="margin-left: auto;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Render</button>
    </div>

    <!-- MAIN APP AREA -->
    <div id="main-area">
        <div id="left-panel">
            
            <!-- INSPECTOR -->
            <div>
                <h3>Inspector</h3>
                <div class="prop-box" id="inspector-panel">
                    <div class="prop-row"><span class="prop-label">Name</span> <input type="text" id="prop-name" value="None"></div>
                    <div class="prop-row"><span class="prop-label">Type</span> <span id="prop-type" style="color:#888;">-</span></div>
                    <div style="height: 1px; background: var(--border); margin: 8px 0;"></div>
                    <div class="prop-row"><span class="prop-label">Pos</span><div class="transform-group"><input type="number" id="pos-x" step="0.1" placeholder="X"><input type="number" id="pos-y" step="0.1" placeholder="Y"><input type="number" id="pos-z" step="0.1" placeholder="Z"></div></div>
                    <div class="prop-row"><span class="prop-label">Rot</span><div class="transform-group"><input type="number" id="rot-x" step="1" placeholder="X"><input type="number" id="rot-y" step="1" placeholder="Y"><input type="number" id="rot-z" step="1" placeholder="Z"></div></div>
                    <div class="prop-row"><span class="prop-label">Scale</span><div class="transform-group"><input type="number" id="scl-x" step="0.1" placeholder="X"><input type="number" id="scl-y" step="0.1" placeholder="Y"><input type="number" id="scl-z" step="0.1" placeholder="Z"></div></div>
                </div>
            </div>

            <!-- SETTINGS -->
            <div>
                <h3>Settings</h3>
                <div class="prop-box">
                    <div class="prop-row"><span class="prop-label" style="color:#44ff44;">Show FPS</span> <input type="checkbox" id="toggle-fps"></div>
                    <div class="prop-row"><span class="prop-label" style="color:#ffcc00;" title="Lowers resolution and disables shadow updates for massive FPS boost!">Performance Mode</span> <input type="checkbox" id="toggle-perf"></div>
                </div>
            </div>

            <!-- ENVIRONMENT -->
            <div>
                <h3>Lighting & Environment</h3>
                <div class="prop-box">
                    <div class="prop-row" style="margin-bottom: 5px;">
                        <span class="prop-label">Skybox Type</span>
                        <select id="skybox-shape"><option value="Sphere">Sphere (Panorama)</option><option value="Cube">Cube (Square Box)</option></select>
                    </div>
                    <button id="skybox-btn" style="width: 100%; margin-bottom: 10px; border: 1px solid #444;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Set Skybox Image</button>
                    <input type="file" id="skybox-input" class="hidden-input" accept="image/*">
                    <div class="prop-row"><span class="prop-label" style="color:white; font-weight:bold;">Show Grid</span> <input type="checkbox" id="toggle-ground" checked></div>
                    <div style="height: 1px; background: var(--border); margin: 8px 0;"></div>
                    
                    <div class="prop-row"><span class="prop-label" title="Controls realistic shading">Shadows</span> <input type="checkbox" id="toggle-shadows" checked></div>
                    <div class="prop-row"><span class="prop-label">Ambient (Sky)</span> <input type="color" id="ambient-color" value="#ffffff"></div>
                    <div class="prop-row"><span class="prop-label">Ambient (Floor)</span> <input type="color" id="ambient-ground-color" value="#444444"></div>
                    <div class="prop-row"><span class="prop-label">Ambient Power</span> <input type="range" id="ambient-intensity" min="0" max="2" step="0.1" value="0.6"></div>
                    <div style="height: 1px; background: var(--border); margin: 8px 0;"></div>
                    <div class="prop-row"><span class="prop-label">Sun Color</span> <input type="color" id="sun-color" value="#ffffff"></div>
                    <div class="prop-row"><span class="prop-label">Sun Power</span> <input type="range" id="sun-intensity" min="0" max="3" step="0.1" value="1.0"></div>
                </div>
            </div>
        </div>

        <div id="viewport" tabindex="0">
            <div id="fps-counter">60 FPS</div>
        </div>

        <div id="right-panel">
            <div id="explorer-header">
                Explorer
                <button id="add-folder" style="padding: 2px 4px;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg></button>
            </div>
            <div id="explorer-tree"></div>
        </div>
    </div>

    <!-- BOTTOM: ASSET BROWSER -->
    <div id="asset-browser">
        <div id="file-header">
            <h3>Asset Browser</h3>
            <button id="upload-btn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Import Files / Zips</button>
            <input type="file" id="hidden-file-input" class="hidden-input" multiple accept=".png, .jpg, .jpeg, .glb, .gltf, .obj, .fbx, .zip">
        </div>
        <div id="asset-grid"></div>
    </div>

    <script>
        const Icons = {
            box: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,
            user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
            sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/></svg>`,
            image: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
            folder: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`
        };

        const viewport = document.getElementById('viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        const camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
        camera.position.set(0, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        viewport.appendChild(renderer.domElement);

        const orbit = new THREE.OrbitControls(camera, renderer.domElement);
        orbit.target.set(0, 3, 0); orbit.enableZoom = false; orbit.update();

        // CAMERA MOVEMENT (WASD)
        const keys = { w: false, a: false, s: false, d: false, q: false, e: false, shift: false };
        window.addEventListener('keydown', (e) => {
            if(document.activeElement.tagName === 'INPUT') return; 
            const k = e.key.toLowerCase(); if (keys.hasOwnProperty(k)) keys[k] = true;
            if (e.key === 'Shift') keys.shift = true;
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase(); if (keys.hasOwnProperty(k)) keys[k] = false;
            if (e.key === 'Shift') keys.shift = false;
        });
        viewport.addEventListener('wheel', (e) => {
            const speed = keys.shift ? 0.3 : 1.5; const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
            if (e.deltaY < 0) { camera.position.addScaledVector(dir, speed); orbit.target.addScaledVector(dir, speed); } 
            else { camera.position.addScaledVector(dir, -speed); orbit.target.addScaledVector(dir, -speed); }
            orbit.update();
        }, { passive: true });

        const transformControl = new THREE.TransformControls(camera, renderer.domElement);

        async function scanZipFile(zipData, pathPrefix = "") {

                if (zipEntry.dir || zipEntry.name.includes('__MACOSX') || zipEntry.name.includes('.DS_Store')) continue;
                const fullPath = pathPrefix + zipEntry.name; const cleanName = fullPath.split('/').pop(); const folderPath = fullPath.substring(0, fullPath.length - cleanName.length); const ext = cleanName.split('.').pop().toLowerCase();
                if (ext === 'zip') { const nestedData = await zipEntry.async("arraybuffer"); const nestedFound = await scanZipFile(nestedData, folderPath + cleanName + " / "); if (nestedFound) foundSomething = true; } 
                else if (['png', 'jpg', 'jpeg', 'glb', 'gltf', 'obj', 'fbx'].includes(ext)) {
                    foundSomething = true; const isImg = ['png', 'jpg', 'jpeg'].includes(ext); const row = document.createElement('div'); row.className = 'zip-item';
                    let displayHTML = `<span style="opacity: 0.8; width: 14px;">${isImg ? Icons.image : Icons.box}</span>`; if (folderPath) displayHTML += `<span class="zip-folder-path">${folderPath}</span>`; displayHTML += `<span class="zip-file-name">${cleanName}</span>`;

                    buttonsHTML += `<button class="btn-primary extract-btn" style="padding: 2px 8px;">Extract to Assets</button>`;
                    row.innerHTML = `<div class="zip-item-name" title="${fullPath}">${displayHTML}</div><div class="zip-actions">${buttonsHTML}</div>`;
                    if (isImg) { row.querySelector('.apply-btn').onclick = () => { if(!selectedObject) return alert("Select an object!"); zipEntry.async('blob').then(function(blob) { const url = URL.createObjectURL(blob); textureLoader.load(url, (tex) => { tex.magFilter = THREE.NearestFilter; selectedObject.traverse((child) => { if (child.isMesh && child.userData.selectable) { child.material = new THREE.MeshStandardMaterial({ map: tex, color: 0xffffff }); child.material.needsUpdate = true; } }); }); createAssetCard(url, cleanName, true, ext, true); row.querySelector('.apply-btn').innerText = "Applied ✓"; row.querySelector('.apply-btn').style.background = "#28a745"; row.querySelector('.apply-btn').style.borderColor = "#28a745"; }); }; }
                    row.querySelector('.extract-btn').onclick = () => { zipEntry.async('blob').then(function(blob) { createAssetCard(URL.createObjectURL(blob), cleanName, isImg, ext, true); row.querySelector('.extract-btn').innerText = "Extracted ✓"; row.querySelector('.extract-btn').style.background = "#28a745"; row.querySelector('.extract-btn').style.borderColor = "#28a745"; }); };

                        if (!found && zipContentDiv.innerHTML === '') zipContentDiv.innerHTML = '<span style="color:#888; padding: 10px;">No models/images found in ZIP.</span>';
                    });
                } else { const ext = fileName.split('.').pop(); createAssetCard(URL.createObjectURL(file), file.name, file.type.startsWith('image/'), ext, false); }
            }
        });

        function spawnThick2DPlane(imgURL, name) {
            textureLoader.load(imgURL, (texture) => {
                texture.magFilter = THREE.NearestFilter; const aspect = texture.image.width / texture.image.height; const group = new THREE.Group(); group.userData = { name: name, type: "Decal", icon: "image" };
                const texMat = new THREE.MeshStandardMaterial({ map: texture, transparent: true, alphaTest: 0.1 }); const edgeMat = new THREE.MeshStandardMaterial({ color: 0x333333 }); 
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(4 * aspect, 4, 0.2), [edgeMat, edgeMat, edgeMat, edgeMat, texMat, texMat]);
                mesh.userData.selectable = true; group.add(mesh); group.position.set(0, 2, -3); addToScene(group);
            });
        }

        // VIEWPORT DRAG/DROP
        viewport.addEventListener('dragover', (e) => e.preventDefault());
        viewport.addEventListener('drop', (e) => {
            e.preventDefault();
            const texURL = e.dataTransfer.getData('application/texture-url'), texName = e.dataTransfer.getData('application/texture-name');
            if (texURL) {
                const rect = renderer.domElement.getBoundingClientRect(); mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1; mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera); let hit = raycaster.intersectObjects(scene.children, true).find(hit => hit.object.userData.selectable);
                if (hit) { textureLoader.load(texURL, (tex) => { tex.magFilter = THREE.NearestFilter; hit.object.material = new THREE.MeshStandardMaterial({ map: tex, color: 0xffffff }); hit.object.material.needsUpdate = true; }); selectObj(hit.object.parent); } else spawnThick2DPlane(texURL, texName);
                return;
            }
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) { fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); }
        });

        // RAYCASTING
        viewport.addEventListener('pointerdown', (event) => {
            viewport.focus(); const rect = renderer.domElement.getBoundingClientRect(); mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1; mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera); let clicked = raycaster.intersectObjects(scene.children, true).find(hit => hit.object.userData.selectable);
            if (clicked && !transformControl.dragging) selectObj(clicked.object.parent); else if (!transformControl.dragging) selectObj(null);
        });

        // RENDER LOOP & FPS
        document.getElementById('render-btn').onclick = () => { selectObj(null); scene.traverse((c) => { if (c.userData.hideOnRender) c.visible = false; }); renderer.render(scene, camera); const link = document.createElement('a'); link.download = 'Studio_Render.png'; link.href = renderer.domElement.toDataURL("image/png"); link.click(); scene.traverse((c) => { if (c.userData.hideOnRender) c.visible = true; }); };
        window.addEventListener('resize', () => { camera.aspect = viewport.clientWidth / viewport.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(viewport.clientWidth, viewport.clientHeight); });
        
        let frames = 0, prevTime = performance.now();
        function animate() { 
            requestAnimationFrame(animate); 
            
            // FPS Counter
            frames++;
            const time = performance.now();
            if (time >= prevTime + 1000) {
                fpsCounter.innerText = Math.round((frames * 1000) / (time - prevTime)) + " FPS";
                frames = 0; prevTime = time;
            }

            if(document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                const speed = keys.shift ? 0.05 : 0.2; const dir = new THREE.Vector3(); camera.getWorldDirection(dir); const sideDir = new THREE.Vector3().crossVectors(dir, camera.up).normalize();
                if (keys.w) { camera.position.addScaledVector(dir, speed); orbit.target.addScaledVector(dir, speed); }
                if (keys.s) { camera.position.addScaledVector(dir, -speed); orbit.target.addScaledVector(dir, -speed); }
                if (keys.a) { camera.position.addScaledVector(sideDir, -speed); orbit.target.addScaledVector(sideDir, -speed); }
                if (keys.d) { camera.position.addScaledVector(sideDir, speed); orbit.target.addScaledVector(sideDir, speed); }
                if (keys.e) { camera.position.y += speed; orbit.target.y += speed; } 
                if (keys.q) { camera.position.y -= speed; orbit.target.y -= speed; } 
                if (keys.w || keys.a || keys.s || keys.d || keys.e || keys.q) orbit.update();
            }
            renderer.render(scene, camera); 
        }
        updateExplorer(); animate();
    </script>
</body>
</html>
